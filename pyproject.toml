[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snowbib"
version = "0.1.0"
description = "Keep a research field as an Obsidian vault, and stop your agent re-proposing papers you already filed"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["bibliography", "obsidian", "openalex", "citations", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["pymupdf4llm>=0.0.17"]

[project.urls]
Homepage = "https://github.com/carsanmilcar/snowbib"

[project.scripts]
snowbib-init = "snowbib.init:main"
snowbib-discover = "snowbib.discover:main"
snowbib-cites = "snowbib.cites:main"
snowbib-fetch = "snowbib.fetch:main"
snowbib-convert = "snowbib.convert:main"
snowbib-index = "snowbib.index:main"
snowbib-check = "snowbib.check:main"
snowbib-screen = "snowbib.screen:main"

[tool.setuptools]
packages = ["snowbib"]
